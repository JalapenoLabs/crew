[package]
name = "crew-cli"
description = "The crew command-line front-end (the crew binary)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The human front-end binary is `crew` (crew up, crew send, crew watch, crew down).
[[bin]]
name = "crew"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Application conventions: eyre for errors (M-APP-ERROR), mimalloc allocator
# (M-MIMALLOC-APPS), the shared logging init, and tracing for structured events.
eyre.workspace = true
mimalloc.workspace = true
crew-telemetry.workspace = true
tracing.workspace = true
# The command surface (crew up, crew down, crew watch, ...).
clap.workspace = true
# The substrate, as one dependency (issue #34): `crew up`/`down` drive the supervisor
# and the in-process broker through `crew_substrate::{broker, supervisor}`, the agent
# CLI shim (issue #28) reuses `crew_substrate::client::Broker` so a runtime without MCP
# maps its I/O onto the broker identically to the MCP path, and `crew watch` (issue #15)
# tails the broker's SSE stream, rendering `crew_substrate::core` event types. The CLI
# depends only on the substrate's public API, not the individual crates.
crew-substrate.workspace = true
# `crew up` runs the broker in-process (async) and waits on a shutdown signal; ureq
# probes an already-running broker's health before starting one, tails the SSE stream
# for `crew watch`, and posts the General's `crew redirect` / `crew belay` directives.
tokio.workspace = true
ureq.workspace = true
# `crew watch` parses the SSE event JSON and formats each event's timestamp, the
# directive commands build their JSON body, and the shim integration test inspects the
# broker's JSON.
serde_json.workspace = true
chrono.workspace = true
# `crew top` (issue #51) deserializes the `/roster` and `/stats` snapshots into typed
# rows with serde derive, and renders the live cockpit with ratatui.
serde.workspace = true
ratatui.workspace = true
