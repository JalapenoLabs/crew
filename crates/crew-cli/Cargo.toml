[package]
name = "crew-cli"
description = "The crew command-line front-end (the crew binary)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The human front-end binary is `crew` (crew up, crew send, crew watch, crew down).
[[bin]]
name = "crew"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Application conventions: eyre for errors (M-APP-ERROR), mimalloc allocator
# (M-MIMALLOC-APPS), the shared logging init, and tracing for structured events.
eyre.workspace = true
mimalloc.workspace = true
crew-telemetry.workspace = true
tracing.workspace = true
# The command surface (crew up, crew down, ...).
clap.workspace = true
# The substrate crates the CLI drives: `crew up`/`down` the supervisor and the
# in-process broker, and `crew send`/`watch` the broker. crew-core carries the crew
# config `crew up` reads.
crew-core.workspace = true
crew-broker.workspace = true
crew-supervisor.workspace = true
# `crew up` runs the broker in-process (async) and waits on a shutdown signal; ureq
# probes an already-running broker's health before starting one.
tokio.workspace = true
ureq.workspace = true
