[package]
name = "crew-supervisor"
description = "The crew process supervisor: spawns and manages role-scoped agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The shared role-card format and loader (issue #18), and eyre for the I/O the
# provisioner performs when it writes a card for a spawned agent (M-APP-ERROR).
crew-core.workspace = true
# The shared broker HTTP agent builder (`broker_agent`), so the roster client and
# the agent-facing client tune the localhost transport in one place (issue #200).
crew-client.workspace = true
eyre.workspace = true
# The roster client: a synchronous, http-only HTTP client (no TLS system dep, since
# the broker is localhost) plus JSON for its request and response bodies.
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
# Structured logging for spawn and lifecycle events (M-LOG-STRUCTURED).
tracing.workspace = true
# Timestamp math for the coordination-stall monitor: the age of an unanswered wait
# or a held ledger task, read from the event stream (issue #48).
chrono.workspace = true

[dev-dependencies]
# Run a real broker in-process for the end-to-end spawn test (issue #21).
crew-broker.workspace = true
tokio = { workspace = true }
