[package]
name = "crew-broker"
description = "The crew message broker: the localhost crewd HTTP + SSE service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The broker daemon. The library holds the service; this is its thin entry point.
[[bin]]
name = "crewd"
path = "src/bin/crewd.rs"

[lints]
workspace = true

[dependencies]
crew-core.workspace = true
# Application conventions (issue #4): eyre errors, tracing events, the shared
# logging init, and the mimalloc allocator for the crewd binary.
eyre.workspace = true
tracing.workspace = true
crew-telemetry.workspace = true
mimalloc.workspace = true
# The service: async runtime, HTTP framework, and serde for the event wire types.
tokio.workspace = true
axum.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Drive the router directly in unit tests (ServiceExt::oneshot) without a socket.
tower = { version = "0.5", features = ["util"] }
# Drive a real in-process broker over HTTP + SSE in the integration suite (issue #16).
# http-only (no TLS backend) since the broker is localhost, so the suite needs no
# system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
