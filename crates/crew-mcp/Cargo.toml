[package]
name = "crew-mcp"
description = "The crew agent-facing MCP surface (crew_send, crew_inbox, crew_roster)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The agent-facing MCP server binary. Claude Code (or Codex) spawns it and talks
# JSON-RPC over stdio; the library holds the logic, this is its thin entry point.
[[bin]]
name = "crew-mcp"
path = "src/main.rs"

[dependencies]
# The shared vocabulary (the lane types) and the broker client the tools dispatch
# to (issue #129); `Config` gives the broker address for the env-fallback boot. The
# server never touches the store: the client talks the broker's HTTP + SSE API.
crew-core.workspace = true
crew-broker.workspace = true
crew-client.workspace = true
# Application conventions: eyre errors (M-APP-ERROR) and the mimalloc allocator
# (M-MIMALLOC-APPS) for the binary.
eyre.workspace = true
mimalloc.workspace = true
# The MCP JSON-RPC messages and tool arguments.
serde_json.workspace = true
