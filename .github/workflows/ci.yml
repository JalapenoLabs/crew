name: CI

# Check every pull request and every push to the long-lived branches (issue #5).
on:
  pull_request:
  push:
    branches: [main, develop]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The nightly toolchain the `fmt-nightly` job runs, pinned to a date so it never
# floats (issue #60). Bump this deliberately, the same way `rust-toolchain.toml`
# pins the build toolchain.
env:
  NIGHTLY: nightly-2026-07-22

# Independent jobs, so each reports its own status check and a failure in one never
# short-circuits the others ("no fail-fast"). Each build job provisions the toolchain
# pinned in rust-toolchain.toml (1.88 with rustfmt + clippy); `rustup show` installs
# exactly that and fails early with a clear message if it cannot.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - run: cargo fmt --all --check

  # The stable `fmt` job above ignores the nightly-only options in rustfmt.toml
  # (import grouping, comment wrapping); this job enforces them on the pinned
  # nightly, so the richer formatting is checked without unpinning the build
  # toolchain (issue #60).
  fmt-nightly:
    name: Format (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly rustfmt
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component rustfmt
      - run: cargo "+$NIGHTLY" fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # Build the public API docs with warnings denied, so a broken intra-doc link
  # (a dangling `[`Item`]`, a public doc pointing at a private item) fails the
  # gate instead of shipping broken rustdoc (issue #161). `--no-deps` keeps it
  # to this workspace's crates; the docs never publish, this only checks them.
  doc:
    name: Doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --workspace --all-features

  # Scan the dependency tree (direct and transitive) for known security
  # advisories in the RustSec database, so a vulnerable crate fails the gate
  # rather than shipping (issue #215, M-STATIC-VERIFICATION). `cargo audit` reads
  # the committed `Cargo.lock` and exits non-zero on a vulnerability; the
  # informational advisories (`unmaintained`, `unsound`) it also reports do not
  # fail the gate, since they are usually transitive and not directly fixable.
  # The tool is version-pinned like the rest, but the advisory database it checks
  # against is fetched fresh each run, so the scan stays current between bumps.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
