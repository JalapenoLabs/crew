name: CI

# Check every pull request and every push to the long-lived branches (issue #5).
on:
  pull_request:
  push:
    branches: [main, develop]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Three independent jobs, so each reports its own status check and a failure in
# one never short-circuits the others ("no fail-fast"). Each provisions the
# toolchain pinned in rust-toolchain.toml (1.88 with rustfmt + clippy); `rustup
# show` installs exactly that and fails early with a clear message if it cannot.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
